<!-- 1. WILLIAMS SONOMA STYLE SEPARATED FRONTEND UI -->
<div id="williams-sonoma-chat-container" style="position: fixed; bottom: 25px; right: 25px; z-index: 999999;">
    <!-- Your Exact Static Resource Icon -->
    <div id="williamsSonomaBtn" style="cursor: pointer; width: 60px; height: 60px; border-radius: 50%; background-color: #ffffff; box-shadow: 0 8px 24px rgba(0,0,0,0.15); display: flex; align-items: center; justify-content: center; transition: all 0.3s ease;">
        <img 
            src="https://force.com?" 
            alt="Chat with Agent" 
            style="width: 50px; height: 50px; display: block; object-fit: contain;"
        />
    </div>
</div>

<!-- 2. ISOLATED AGENTFORCE V2 INTERACTION BRIDGE ENGINE -->
<script type='text/javascript'>
	function initEmbeddedMessaging() {
		try {
			embeddedservice_bootstrap.settings.language = 'en_US'; 
			
			// Force Salesforce to keep its own button invisible
			embeddedservice_bootstrap.settings.hideChatButtonOnLoad = true;

			// FIXED HERE: This is the event Williams Sonoma uses. 
			// We only activate the custom click tracker AFTER Salesforce is fully ready.
			window.addEventListener("onEmbeddedMessagingReady", function() {
				console.log("Salesforce Core Engine Ready. Binding Custom Williams Sonoma Trigger...");
				
				var customButtonElement = document.getElementById('williamsSonomaBtn');
				if (customButtonElement) {
					customButtonElement.addEventListener('click', function() {
						// Execute the official launch promise to maximize the widget layout
						embeddedservice_bootstrap.utilAPI.launchChat()
							.then(function() {
								console.log("Chat window opened successfully.");
								// Hide custom floating entry point when window expands
								customButtonElement.style.opacity = '0';
								customButtonElement.style.pointerEvents = 'none';
							})
							.catch(function(error) {
								console.error('Failed to trigger Agentforce engine:', error);
							});
					});
				}
			});

			// Restore your custom image button if the user closes the chat panel
			window.addEventListener("onEmbeddedMessagingWindowClosed", function() {
				var customButtonElement = document.getElementById('williamsSonomaBtn');
				if (customButtonElement) {
					customButtonElement.style.opacity = '1';
					customButtonElement.style.pointerEvents = 'auto';
				}
			});

			// Standard Salesforce handshakes
			embeddedservice_bootstrap.init(
				'00Dfj00000Q0q2r',
				'Service_Desk_Agent_Deployment',
				'https://site.com',
				{
					scrt2URL: 'https://salesforce-scrt.com'
				}
			);

		} catch (err) {
			console.error('Error establishing isolated Agentforce link: ', err);
		}
	};
</script>

<!-- 3. Bootstrap Trigger Initialization -->
<script type='text/javascript' src='https://site.com/assets/js/bootstrap.min.js' onload='initEmbeddedMessaging()'></script>
