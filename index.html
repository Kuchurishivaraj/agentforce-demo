<!-- ================================================================ -->

<!-- CUSTOM CHAT BUTTON                                               -->

<!-- ================================================================ -->

<button id="launchChatButton" type="button">
    Ask Me Anything
</button>

<!-- ================================================================ -->

<!-- EMBEDDED MESSAGING INITIALIZATION                               -->

<!-- ================================================================ -->

<script type='text/javascript'>

    function initEmbeddedMessaging() {
        try {

            embeddedservice_bootstrap.settings.language = 'en_US';

            embeddedservice_bootstrap.init(
                '00Dfj00000Q0q2r',
                'Service_Desk_Agent_Deployment',
                'https://orgfarm-eed0b3298e-dev-ed.develop.my.site.com/ESWServiceDeskAgentDep1781638485611',
                {
                    scrt2URL: 'https://orgfarm-eed0b3298e-dev-ed.develop.my.salesforce-scrt.com'
                }
            );

        } catch (err) {

            console.error(
                'Error loading Embedded Messaging: ',
                err
            );

        }
    }

</script>

<!-- ================================================================ -->

<!-- LOAD SALESFORCE EMBEDDED MESSAGING BOOTSTRAP                    -->

<!-- ================================================================ -->

<script
    type='text/javascript'
    src='https://orgfarm-eed0b3298e-dev-ed.develop.my.site.com/ESWServiceDeskAgentDep1781638485611/assets/js/bootstrap.min.js'
    onload='initEmbeddedMessaging()'>
</script>

<!-- ================================================================ -->

<!-- LAUNCH CHAT API                                                  -->

<!-- ================================================================ -->

<script type='text/javascript'>

    /*
     * Wait until Embedded Messaging has created its button/runtime.
     * Salesforce recommends this event before calling launchChat().
     */
    window.addEventListener(
        'onEmbeddedMessagingButtonCreated',
        function () {

            console.log(
                'Embedded Messaging button created. Launch Chat API is ready.'
            );

            var launchChatButton =
                document.getElementById('launchChatButton');

            if (!launchChatButton) {
                console.error(
                    'Custom launch button not found.'
                );
                return;
            }

            /*
             * Connect the custom button to Salesforce
             * Embedded Messaging.
             */
            launchChatButton.addEventListener(
                'click',
                function () {

                    console.log(
                        'Custom button clicked. Launching chat...'
                    );

                    embeddedservice_bootstrap.utilAPI
                        .launchChat({
                            shouldStartNewConversation: true
                        })

                        .then(function () {

                            /*
                             * Chat launched successfully.
                             * Hide/disable the custom button if required.
                             */
                            console.log(
                                'Chat launched successfully.'
                            );

                            launchChatButton.style.display = 'none';

                        })

                        .catch(function (error) {

                            /*
                             * Chat failed to launch.
                             */
                            console.error(
                                'Failed to launch chat:',
                                error
                            );

                        })

                        .finally(function () {

                            /*
                             * Cleanup/logging can be performed here.
                             */
                            console.log(
                                'Launch Chat API completed.'
                            );

                        });

                }
            );

        }
    );

</script>
