<!-- INITIALIZE EMBEDDED MESSAGING                                   -->

<!-- ================================================================ -->

<script type="text/javascript">

    function initEmbeddedMessaging() {

        try {

            embeddedservice_bootstrap.settings.language = 'en_US';

            /*
             * Tell Salesforce not to show the default launcher
             * when Embedded Messaging loads.
             */
            embeddedservice_bootstrap.settings.hideChatButtonOnLoad = true;

            embeddedservice_bootstrap.init(
                '00Dfj00000Q0q2r',
                'Service_Desk_Agent_Deployment',
                'https://orgfarm-eed0b3298e-dev-ed.develop.my.site.com/ESWServiceDeskAgentDep1781638485611',
                {
                    scrt2URL:
                        'https://orgfarm-eed0b3298e-dev-ed.develop.my.salesforce-scrt.com'
                }
            );

        } catch (err) {

            console.error(
                'Error loading Embedded Messaging: ',
                err
            );

        }

    }

</script>

    src="https://orgfarm-eed0b3298e-dev-ed.develop.my.site.com/ESWServiceDeskAgentDep1781638485611/assets/js/bootstrap.min.js"

<!-- ================================================================ -->

<!-- LAUNCH CHAT API                                                 -->

<!-- ================================================================ -->

<script type="text/javascript">

    var customButtonInitialized = false;


    /*
     * Salesforce fires this after the Embedded Messaging
     * launcher has been created.
     */
    window.addEventListener(
        'onEmbeddedMessagingButtonCreated',
        function () {

            console.log(
                'Embedded Messaging button created.'
            );


            /*
             * Explicitly hide Salesforce's native launcher.
             */
            if (
                typeof embeddedservice_bootstrap !== 'undefined' &&
                embeddedservice_bootstrap.utilAPI
            ) {

                embeddedservice_bootstrap.utilAPI.hideChatButton();

                console.log(
                    'Salesforce native launcher hidden.'
                );

            }


            /*
             * Make sure our custom button is wired only once.
             */
            if (customButtonInitialized) {
                return;
            }


            var customButton =
                document.getElementById(
                    'williamsSonomaBtn'
                );


            if (!customButton) {
                console.error(
                    'Custom Williams Sonoma button not found.'
                );
                return;
            }


            /*
             * Custom button → Launch Chat API
             */
            customButton.addEventListener(
                'click',
                function () {

                    console.log(
                        'Custom button clicked.'
                    );


                    embeddedservice_bootstrap.utilAPI
                        .launchChat({
                            shouldStartNewConversation: true
                        })

                        .then(function () {

                            console.log(
                                'Embedded Messaging launched successfully.'
                            );

                            /*
                             * Hide custom button while
                             * conversation window is open.
                             */
                            document.getElementById(
                                'williams-sonoma-chat-wrapper'
                            ).style.display = 'none';

                        })

                        .catch(function (error) {

                            console.error(
                                'Failed to launch chat:',
                                error
                            );

                        });

                }
            );


            customButtonInitialized = true;

        }
    );


    /*
     * Show our custom button again when
     * Embedded Messaging window closes.
     */
    window.addEventListener(
        'onEmbeddedMessagingWindowClosed',
        function () {

            var wrapper =
                document.getElementById(
                    'williams-sonoma-chat-wrapper'
                );


            if (wrapper) {

                wrapper.style.display = 'block';

            }

        }
    );

</script>
