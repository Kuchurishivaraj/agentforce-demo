<!-- SALESFORCE EMBEDDED MESSAGING                                   -->

<!-- ================================================================ -->

<script type='text/javascript'>

    function initEmbeddedMessaging() {

        try {

            embeddedservice_bootstrap.settings.language = 'en_US';

            embeddedservice_bootstrap.init(
                '00Dfj00000Q0q2r',
                'Service_Desk_Agent_Deployment',
                'https://orgfarm-eed0b3298e-dev-ed.develop.my.site.com/ESWServiceDeskAgentDep1781638485611',
                {
                    scrt2URL: 'https://orgfarm-eed0b3298e-dev-ed.develop.my.salesforce-scrt.com'
                }
            );

        } catch (err) {

            console.error(
                'Error loading Embedded Messaging: ',
                err
            );

        }

    }


    <!-- ============================================================ -->
    <!-- HIDE DEFAULT SALESFORCE LAUNCHER                             -->
    <!-- ============================================================ -->

    embeddedservice_bootstrap.onEmbeddedMessagingButtonCreated =
        function() {

            console.log(
                'Embedded Messaging button created.'
            );

            embeddedservice_bootstrap.utilAPI.hideChatButton();

            console.log(
                'Default Salesforce launcher hidden.'
            );

        };


    <!-- ============================================================ -->
    <!-- CUSTOM IMAGE → LAUNCH CHAT                                   -->
    <!-- ============================================================ -->

    function launchCustomAgentforceChat() {

        console.log(
            'Custom Agentforce button clicked.'
        );

        embeddedservice_bootstrap.utilAPI.launchChat()
            .then(function() {

                console.log(
                    'Embedded Messaging launched successfully.'
                );

                /*
                 * Optional:
                 * Hide custom image while the chat window
                 * is open.
                 */
                document.getElementById(
                    'customAgentforceButton'
                ).style.display = 'none';

            })
            .catch(function(error) {

                console.error(
                    'Failed to launch Embedded Messaging:',
                    error
                );

            });

    }


    /*
     * Connect custom image to Launch Chat API.
     */
    document.getElementById(
        'customAgentforceButton'
    ).addEventListener(
        'click',
        launchCustomAgentforceChat
    );

</script>
